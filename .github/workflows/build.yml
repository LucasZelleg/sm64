name: Build SM64 Vanilla for R36S

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build inside Ubuntu 20.04 ARM64 container
        run: |
          docker run --rm -v ${{ github.workspace }}:/sm64 -w /sm64 --platform linux/arm64 ubuntu:20.04 bash -c "
            export DEBIAN_FRONTEND=noninteractive
            apt-get update && apt-get install -y build-essential git libsdl2-dev tzdata
            make VERSION=eu GRAPHICS=gles2 WINDOW_BACKEND=sdl2 HIGH_FPS=1 -j\$(nproc)
          "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sm64-r36s-vanilla
          path: build/eu_pc/sm64.eu
